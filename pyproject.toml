[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bgpstuff"
version = "3.0.0"
description = "Python Client for Connecting to BGPStuff.net REST API v3"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Darren O'Connor", email = "nouser@bgpstuff.net"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]
dependencies = [
    "cachetools",
    "bogons>=1.4.1",
    "requests",
]

[project.urls]
Homepage = "https://github.com/mellowdrifter/python-bgpstuff.net"
Repository = "https://github.com/mellowdrifter/python-bgpstuff.net"
